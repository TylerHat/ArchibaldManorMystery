; ---------------------------------------------------------------------------
; Doctor_Male_Old   (materials: skin main black brown hair)
; NOT a suspect. Lord Reginald's model lives in Models/Victim/, but he reads
; his tuning from here like everyone else.
;
; rot_x/rot_z lay a standing model on its back, head toward +X, which is the
; long axis of the body's collision box. rot_y MUST be 0 here - it would
; otherwise inherit 180 from [default] and spin him off the box.
;   face down instead:  rot_x=90.0
;   head the other way: rot_z=90.0
; center_xz slides him onto the middle of the box, since rotating about his
; feet leaves him sprawled off to one side of his own origin.
[victim]           ; Lord Reginald Archibald - the deceased
color_skin="#b9a596"
color_hair="#b4b0a8"
color_main="#2a2b33"
color_black="#17171c"
color_brown="#4a3a2a"
rot_x=-90.0
rot_y=0.0
rot_z=-90.0
center_xz=true
