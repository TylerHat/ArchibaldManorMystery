; Optional tuning for the suspect models in Models/Suspects/<id>/.
;
; You do not have to touch this file. Every value below has a working default
; and a model dropped into a suspect folder will show up without any of this.
; It exists for the two or three things that always go slightly wrong when you
; import a character: wrong size, facing the wrong way, feet in the floor.
;
; [default] applies to every suspect. A section named after a suspect id
; overrides [default] for that one person only.
;
; Keys:
;   auto_fit_height  true  = rescale the model to 1.8m so it matches its own
;                            collision capsule and fits through doorways.
;                            Set false if you have already sized it in Blender.
;   scale            extra multiplier applied on top of auto_fit_height.
;                    1.0 = leave it alone, 1.1 = 10% taller.
;   y_offset         nudge up (+) or down (-) in metres. Only needed if the
;                    model still floats or sinks after auto-fitting.
;   rot_y            spin the model in place, in degrees.
;
; ---------------------------------------------------------------------------
; IF EVERYONE FACES BACKWARDS, change rot_y below to 180.0 and you are done.
; That is by far the most common thing to go wrong with Blender characters:
; Godot treats -Z as forward, and a lot of models are authored facing +Z.
; ---------------------------------------------------------------------------

[default]

auto_fit_height=true
scale=1.0
y_offset=0.0
rot_y=0.0


; Per-suspect overrides. Uncomment the ones you need and delete the rest.
; The ids match the folder names under Models/Suspects/.
;
; [blackwood]      ; Dr. Evelyn Blackwood - Forensic Pathologist
; [sterling]       ; Marcus Sterling - Investment Banker
; [ashford]        ; Victoria Ashford - Art Dealer
; [carter]         ; Samuel "Sam" Carter - Private Investigator
; [whitmore]       ; Eleanor Whitmore - Political Consultant
; [reeves]         ; Thomas "Tom" Reeves - Estate Manager
; [cross_natalie]  ; Natalie Cross - Investigative Journalist
; [cross_eugene]   ; Eugene Cross - Butler
; [moreau]         ; Emma Moreau - Ghostwriter
; [varga]          ; Count Lucian Varga - "Gentleman of Independent Means"
; [pike]           ; Desmond "Giggles" Pike - Children's Entertainer
; [thorne]         ; Agnes Thorne - Head Gardener
;
; For example, to make the Count a little taller than everyone else:
;
; [varga]
; scale=1.08
