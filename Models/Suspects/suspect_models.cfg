; Tuning for the suspect models in Models/Suspects/<id>/.
;
; [default] applies to every suspect. A section named after a suspect id
; overrides [default] for that one person only. Changes take effect on the next
; run - no reimport needed.
;
; --------------------------------------------------------------------- size --
;   auto_fit_height  true = rescale to 1.8m so the model matches its collision
;                    capsule and fits the doorways. false if you sized it in
;                    Blender already.
;   scale            extra multiplier on top of auto_fit_height. 1.1 = 10% taller.
;   y_offset         nudge up (+) / down (-) in metres, if feet float or sink.
;   rot_y            spin in place, degrees. 180 because Godot treats -Z as
;                    forward and these models are authored facing +Z - without
;                    it every suspect walks backwards.

[default]

auto_fit_height=true
scale=1.0
y_offset=0.0
rot_y=180.0

; -------------------------------------------------------------------- color --
; Any key `color_<material>` retints the material of that name. Every character
; in this pack ships with Skin set to #1f1f1f, so without this their heads and
; hands are black silhouettes. This is the fallback for anyone with no section
; of their own below.

color_skin="#d9a273"

; Material names differ per model, so you can only recolor what a model has:
;
;   Casual_Male / Casual_Female / Casual2_Female / Casual3_Male / Casual_Bald
;                        Skin  Shirt  Pants  Belt  Face  Hair
;   Suit_Male / Suit_Female
;                        Skin  Black  Belt   Shirt  Details  Face  Hair
;   OldClassy_Male / OldClassy_Female
;                        Skin  Pants  Shirt  Detail  Belt  Face  Hat  Hair
;   Doctor_Female_Young  Skin  Main   Black  Brown  Face  Hair
;   Wizard               Skin  Clothes  Belt  Gold  Hat  Face  Hair
;   Worker_Female        Skin  Shirt  Vest   Pants  Hat  Face  Hair
;
; `Face` is the eye whites - leave it alone unless you want something odd.
; An unknown name is simply ignored, so a stray key can't break a model.


[blackwood]        ; Dr. Evelyn Blackwood - Forensic Pathologist
color_skin="#e8c19a"
color_hair="#2e2119"

