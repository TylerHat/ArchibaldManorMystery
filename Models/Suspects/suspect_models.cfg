; Tuning for the suspect models in Models/Suspects/<id>/.
;
; [default] applies to every suspect. A section named after a suspect id
; overrides [default] for that one person only. Changes take effect on the next
; run - no reimport needed.
;
; --------------------------------------------------------------------- size --
;   auto_fit_height  true = rescale to 1.8m so the model matches its collision
;                    capsule and fits the doorways. false if you sized it in
;                    Blender already.
;   scale            extra multiplier on top of auto_fit_height. 1.1 = 10% taller.
;   y_offset         nudge up (+) / down (-) in metres, if feet float or sink.
;   rot_y            spin in place, degrees. 180 because Godot treats -Z as
;                    forward and these models are authored facing +Z - without
;                    it every suspect walks backwards.

[default]

auto_fit_height=true
scale=1.0
y_offset=0.0
rot_y=180.0

; -------------------------------------------------------------------- color --
; color_<material>="#rrggbb" retints the material of that name. So
; color_shirt="#5f6b42" repaints every surface whose material is called Shirt.
; Grab a hex from any online color picker; keep the # and the quotes.
;
; YOU CAN ONLY RECOLOR A MATERIAL THE MODEL ACTUALLY HAS. That is why some of
; these did nothing before - Doctor_Female_Young has no Shirt or Pants at all,
; it has Main/Black/Brown, and the Suit models have no Pants (the trousers are
; part of Black). Each section below now lists its model's real materials, read
; straight out of the .blend files rather than guessed.
;
;   Casual_Male / Casual_Female / Casual2_Female / Casual3_Male / Casual_Bald
;                          skin  shirt  pants  belt  hair
;   Suit_Male / Suit_Female
;                          skin  black  shirt  details  belt  hair
;   OldClassy_Male / OldClassy_Female
;                          skin  shirt  pants  detail  belt  hat  hair
;   Doctor_Female_Young    skin  main  black  brown  hair
;   Wizard                 skin  clothes  gold  belt  hat  hair
;   Worker_Female          skin  shirt  vest  pants  hat  hair
;
; `details` is plural on the Suit models and singular `detail` on the OldClassy
; ones. That is how the artist named them, not a typo here.
;
; An unknown material name is ignored and a bad hex prints a warning and keeps
; the model's own color, so nothing you type here can break a character.
;
; Every model also has a Face material, deliberately never set in this file -
; it is the eye whites, and it is meant to stay white.

color_skin="#d9a273"


